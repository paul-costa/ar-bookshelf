<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AR Bookshelf</title>
<meta name="description" content="Interaktives Bücherregal: das echte Regal gezeichnet und als Foto, daneben das digitale Kindle-Regal. Mit ← → hinübergehen, über ein Buch fahren für Titel, Autor, Cover und Goodreads-Rating.">
<meta property="og:title" content="AR Bookshelf">
<meta property="og:description" content="Interaktives Bücherregal mit AR-Overlay und digitalem Kindle-Regal.">
<meta property="og:image" content="img/og.jpg">
<meta name="theme-color" content="#05080d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2305080d'/%3E%3Cpath d='M8 7v18M13 9v16M18 6v19l6-2-4-16' stroke='%2346f0e1' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Oswald:wght@500&family=Playfair+Display:wght@700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<main id="stage" aria-label="Bücherregal">
  <canvas id="bg" aria-hidden="true"></canvas>
  <div id="world">
    <svg id="drawn" aria-hidden="true">
      <defs>
        <linearGradient id="gBoard" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#2b2a30"/><stop offset=".12" stop-color="#18171b"/><stop offset="1" stop-color="#0c0b0e"/>
        </linearGradient>
        <linearGradient id="gSide" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#0d0c0f"/><stop offset=".5" stop-color="#1b1a1f"/><stop offset="1" stop-color="#0d0c0f"/>
        </linearGradient>
        <radialGradient id="gBack" cx=".5" cy=".35" r=".8">
          <stop offset="0" stop-color="#1c1a20"/><stop offset="1" stop-color="#09080b"/>
        </radialGradient>
        <linearGradient id="gUnder" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#000" stop-opacity=".75"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="gSpineV" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#000" stop-opacity=".45"/><stop offset=".12" stop-color="#000" stop-opacity=".05"/>
          <stop offset=".32" stop-color="#fff" stop-opacity=".16"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/>
          <stop offset=".88" stop-color="#000" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity=".5"/>
        </linearGradient>
        <linearGradient id="gSpineH" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff" stop-opacity=".14"/><stop offset=".3" stop-color="#fff" stop-opacity=".04"/>
          <stop offset=".85" stop-color="#000" stop-opacity=".1"/><stop offset="1" stop-color="#000" stop-opacity=".5"/>
        </linearGradient>
        <linearGradient id="gDigBack" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#0a0b24"/><stop offset="1" stop-color="#05061a"/>
        </linearGradient>
        <linearGradient id="gDigSpine" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".18" stop-color="#fff" stop-opacity=".04"/>
          <stop offset=".8" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/>
        </linearGradient>
        <linearGradient id="gShimmer" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#9c8cff" stop-opacity="0"/><stop offset=".5" stop-color="#c9c0ff" stop-opacity=".16"/><stop offset="1" stop-color="#9c8cff" stop-opacity="0"/>
        </linearGradient>
        <pattern id="pGrid" width="120" height="120" patternUnits="userSpaceOnUse">
          <path d="M120 0H0V120" fill="none" stroke="#6f62ff" stroke-opacity=".13" stroke-width="2"/>
          <circle cx="0" cy="0" r="4" fill="#46f0e1" fill-opacity=".25"/>
        </pattern>
        <clipPath id="clipDig"><rect id="clipDigRect"/></clipPath>
      </defs>
      <g id="analog"></g>
      <g id="corridor"></g>
      <g id="digital"></g>
    </svg>
    <img id="shelf" width="4785" height="4300" alt="Foto des Bücherregals" draggable="false">
    <svg id="overlay" aria-hidden="true">
      <defs>
        <clipPath id="clipActive"><polygon id="clipPoly" points=""/></clipPath>
        <filter id="lift" x="-50%" y="-50%" width="200%" height="200%">
          <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#46f0e1" flood-opacity=".55"/>
        </filter>
        <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#46f0e1" stop-opacity="0"/>
          <stop offset=".85" stop-color="#46f0e1" stop-opacity=".35"/>
          <stop offset="1" stop-color="#bffcf6" stop-opacity=".9"/>
        </linearGradient>
      </defs>
      <path id="dim" fill-rule="evenodd" d=""/>
      <g id="matches"></g>
      <g id="hits"></g>
      <g id="focus">
        <g id="lifted" filter="url(#lift)">
          <image id="liftImg" x="0" y="0" width="4785" height="4300" clip-path="url(#clipActive)" preserveAspectRatio="none"/>
          <use id="liftUse" href=""/>
        </g>
        <g id="liftedFx">
          <g clip-path="url(#clipActive)"><rect id="scan" x="0" y="0" width="0" height="0" fill="url(#scanGrad)"/></g>
          <polygon id="outline" points="" vector-effect="non-scaling-stroke"/>
          <path id="brackets" d="" vector-effect="non-scaling-stroke"/>
        </g>
      </g>
      <g id="sweep"><rect id="sweepBar" x="0" y="-200" width="4785" height="200"/></g>
    </svg>
  </div>

  <svg id="leader" aria-hidden="true">
    <circle id="anchorRing" r="10"/>
    <circle id="anchorDot" r="3.5"/>
    <polyline id="leaderLine" points=""/>
  </svg>

  <aside id="card" role="dialog" aria-live="polite" hidden>
    <div class="card-inner">
      <div class="card-head"><span class="tag" id="cTag">ID</span><span class="tag dim" id="cConf"></span><span class="tag" id="cRead" hidden>gelesen</span><button class="close" id="cClose" aria-label="Schließen">✕</button></div>
      <div class="card-body">
        <div class="cover" id="cCoverWrap"><img id="cCover" alt=""><div class="cover-fallback" id="cCoverFb">KEIN<br>COVER</div></div>
        <div class="meta">
          <h2 id="cTitle"></h2>
          <p class="author" id="cAuthor"></p>
          <p class="series" id="cSeries"></p>
          <div class="rating" id="cRating">
            <span class="stars"><span class="stars-bg">★★★★★</span><span class="stars-fg" id="cStars">★★★★★</span></span>
            <span class="num" id="cRatingNum"></span>
          </div>
          <p class="count" id="cCount"></p>
        </div>
      </div>
      <button class="twin" id="cTwin" hidden></button>
      <div class="links">
        <a id="cGr" target="_blank" rel="noopener">Goodreads <span>↗</span></a>
        <a id="cAmz" target="_blank" rel="noopener">Amazon <span>↗</span></a>
      </div>
    </div>
  </aside>

  <button class="walk walk-l" id="goL" aria-label="Zum echten Regal gehen"><span class="chev">◀</span><span class="lbl">Regal</span></button>
  <button class="walk walk-r" id="goR" aria-label="Zum digitalen Regal gehen"><span class="lbl">Digital</span><span class="chev">▶</span></button>
  <div id="zoneBanner" aria-live="polite"><small id="zbNo"></small><strong id="zbName"></strong><span id="zbSub"></span></div>
</main>

<header class="hud hud-top">
  <div class="brand"><span class="blip"></span>AR&nbsp;BOOKSHELF<span class="sub" id="stat">scanning…</span></div>
  <div class="search">
    <input id="q" type="search" placeholder="Titel oder Autor suchen…" autocomplete="off" spellcheck="false" aria-label="Buch suchen">
    <ul id="results" hidden></ul>
  </div>
</header>

<div class="hud hud-bottom">
  <div class="readout" id="readout">X 0000 · Y 0000</div>
  <div class="hint" id="hint"><kbd>←</kbd><kbd>→</kbd> gehen · <kbd>⇧</kbd> rennen · <kbd>F</kbd> Foto · Hover = Info · Scrollen zoomt</div>
  <div class="track" id="track" aria-label="Position">
    <button data-z="0">Regal</button><button data-z="1">Digital</button><i id="trackDot"></i>
  </div>
  <div class="zoom">
    <button id="photo" class="photo" aria-pressed="false" title="Foto einblenden (F)">Foto</button>
    <button id="zIn" aria-label="Hineinzoomen">+</button>
    <button id="zOut" aria-label="Herauszoomen">−</button>
    <button id="zFit" aria-label="Ganzes Regal">⤢</button>
  </div>
</div>

<div id="minimap" aria-hidden="true"><canvas id="mmCanvas"></canvas><div id="mmView"></div></div>

<script src="scene.js"></script>
<script src="books.js"></script>
<script src="digital.js"></script>
<script src="app.js"></script>
</body>
</html>
